<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Frame Art Relay</title>
    <meta name="color-scheme" content="dark light">
    <meta name="theme-color" content="#0b0f19" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Art Relay">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        // Theme chosen in Settings, applied before first paint to avoid a flash
        try {
            var theme = localStorage.getItem('fa_theme');
            if (theme === 'light' || theme === 'dark') {
                document.documentElement.setAttribute('data-theme', theme);
                document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
                    m.setAttribute('content', theme === 'dark' ? '#0b0f19' : '#eef1f6');
                });
            }
        } catch (e) { /* no storage: follow the system */ }
    </script>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <header class="topbar" id="topbar">
        <div class="topbar-inner">
            <div class="brand">
                <img src="/static/icon.png" alt="" width="28" height="28">
                <span class="brand-name">Frame Art Relay</span>
            </div>
            <div class="small-title" id="smallTitle" aria-hidden="true"></div>
            <div class="topbar-actions">
                <button id="settingsBtn" class="round-btn" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
                </button>
            </div>
        </div>
    </header>

    <main id="view" class="container">
        <div class="loading"><span class="spinner"></span></div>
    </main>

    <nav id="tabs" class="tabbar" role="tablist">
        <button type="button" class="tab" role="tab" data-tab="albums" aria-selected="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></svg>
            <span class="tab-label"></span>
        </button>
        <button type="button" class="tab" role="tab" data-tab="tvs" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="4" width="19" height="13" rx="1.5"/><path d="M8 21h8M12 17v4"/></svg>
            <span class="tab-label"></span>
        </button>
        <button type="button" class="tab" role="tab" data-tab="schedule" aria-selected="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
            <span class="tab-label"></span>
        </button>
    </nav>

    <div id="sheet" class="sheet" hidden>
        <div class="sheet-backdrop" data-close></div>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
            <div class="sheet-head" id="sheetHead">
                <div class="grabber" aria-hidden="true"></div>
                <div class="sheet-title-row">
                    <h2 id="sheetTitle"></h2>
                    <button type="button" class="round-btn small" id="sheetHelp" aria-expanded="false" hidden>
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></svg>
                    </button>
                    <button type="button" class="round-btn small" id="sheetClose" data-close aria-label="Close">
                        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
                    </button>
                </div>
            </div>
            <div id="sheetBody" class="sheet-body"></div>
        </div>
    </div>

    <div id="toasts" class="toasts" aria-live="polite"></div>
    <script src="/static/js/app.js"></script>
</body>
</html>
