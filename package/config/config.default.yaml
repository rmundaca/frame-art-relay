app:
  host: "0.0.0.0"
  port: 8092
  debug: false

media:
  # NAS folders that can be chosen as an album source
  roots:
    - "/volume1"

frame:
  # The TV's "My Photos" has limited space
  max_images_per_album: 100
  # Uploads per supervisor cycle, so other TVs are not blocked
  uploads_per_tick: 10
  request_timeout: 15
  upload_timeout: 120
  # Warn when what the app uploaded to a TV exceeds this many MB
  storage_warn_mb: 1024

icloud:
  # Photos downloaded per shared album (stored in data/cache/icloud)
  max_photos: 300
